[unix_http_server]
file=%(here)s/../state/supervisor.sock
chmod=0600

[supervisord]
logfile=%(here)s/../state/supervisor.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=%(here)s/../state/supervisor.pid
childlogdir=%(here)s/../state
umask=0077

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/../state/supervisor.sock

[program:codex-account-pool]
directory=%(here)s/..
command=%(here)s/../bin/codex-pool serve --config %(here)s/../pool.json
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stopwaitsecs=15
redirect_stderr=true
stdout_logfile=%(here)s/../state/server.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
